name: cycle-worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'start-cycle برای چرخه جدید، یا خالی برای ادامه چرخه فعلی'
        required: false
        default: ''

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # npm install به‌جای npm ci: اگر قفل ناهمگام باشد، خودکار همگام می‌شود
      # (npm ci در صورت ناهمگامی با EUSAGE می‌میرد و ورکر اصلاً اجرا نمی‌شود)
      - run: npm install --legacy-peer-deps
      - name: run one team
        run: npx tsx worker/cycle-worker.ts ${{ inputs.action }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
