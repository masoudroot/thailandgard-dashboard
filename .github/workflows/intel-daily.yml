name: intel-daily

on:
  schedule:
    # هر روز ساعت ۰۷:۳۰ تهران (۰۴:۰۰ UTC): جمع‌آوری خبرهای تایلند در intel_feed
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # npm install به‌جای npm ci: اگر قفل ناهمگام باشد، خودکار همگام می‌شود
      - run: npm install --legacy-peer-deps
      - name: collect thailand news into intel_feed
        run: npx tsx worker/intel-daily.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
